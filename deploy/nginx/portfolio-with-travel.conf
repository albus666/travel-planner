server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name agentfolio.duckdns.org 52.199.126.245 _;
    root /home/ubuntu/portfolio;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/webp
        font/woff2;

    location /api/fortune/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /certificates/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(webp|avif|jpe?g|png|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 旅行助手：反代到常驻 RAG 服务（127.0.0.1:8100）。旧规划器删除后这里曾是 410 占位。
    include /etc/nginx/snippets/travel-proxy.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agentfolio.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/agentfolio.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentfolio.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

