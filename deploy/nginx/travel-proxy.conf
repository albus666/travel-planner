# 旅行助手入口：nginx(80/443) -> 常驻 RAG 服务 127.0.0.1:8100
#
# 由 /etc/nginx/sites-available/portfolio 的 :80 与 :443 两个 server 块 include。
# 放在 snippets 里是为了两处完全一致，避免只改一边。
#
# 前缀 /travel/ 会被 proxy_pass 的结尾斜杠剥掉：/travel/ask -> /ask，
# /travel/ui/ -> /ui/。用 ^~ 是为了让上面的静态文件正则 location 不抢先命中
# /travel/ui/app.js 这类路径。

location = /travel { return 301 /travel/; }
location = /travel/ { return 301 /travel/ui/; }

# Swagger UI 页面里写死了 /openapi.json，加这一条让 /travel/docs 能真的加载到规范。
location = /openapi.json {
    proxy_pass http://127.0.0.1:8100/openapi.json;
    proxy_set_header Host $host;
}

location ^~ /travel/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # FastAPI 的 StaticFiles 会把 /ui 301 到 /ui/，把 Location 前缀补回来。
    proxy_redirect ~^(/.*)$ /travel$1;
    # 明确声明字符集：否则浏览器可能按 GBK 猜解 HTML/JS/JSON 而显示乱码。
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;
    # index.html 本身没有版本号，禁用缓存，免得改完页面还被浏览器旧的坏文件顶住。
    expires -1;
    # /agent/ask 单次可能跑到 100 秒（工具预算），给足余量。
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}
